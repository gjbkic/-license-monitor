name: 本免キャンセル監視

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 実行する処理
        type: choice
        options:
          - monitor
          - check_profile
        default: monitor

permissions:
  contents: read

concurrency:
  group: license-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: コード取得
        uses: actions/checkout@v4

      - name: 前回状態を復元
        uses: actions/cache/restore@v4
        with:
          path: .monitor_state.json
          key: monitor-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            monitor-state-

      - name: Python設定
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なものをインストール
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 回帰テスト
        run: python -m unittest -v

      - name: 申込情報の設定を確認
        if: inputs.operation == 'check_profile'
        env:
          APPLICANT_JSON: ${{ secrets.APPLICANT_JSON }}
        run: python autofill.py --check-profile

      - name: 予約状況チェック
        if: inputs.operation != 'check_profile'
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          MONITOR_END_DATE: "2026-12-31"
        run: python monitor.py

      - name: 今回状態を保存
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .monitor_state.json
          key: monitor-state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 障害情報を保存
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: monitor-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/*.json
          if-no-files-found: ignore
          retention-days: 7
