name: 本免キャンセル監視

on:
  workflow_dispatch:

  # 5分ごとの通常監視
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"

permissions:
  contents: read

concurrency:
  group: license-monitor
  cancel-in-progress: true

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: コード取得
        uses: actions/checkout@v4

      - name: Python設定
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なものをインストール
        run: |
          pip install -r requirements.txt
          playwright install chromium --with-deps

      - name: 予約状況チェック
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

          # 手動Run workflowのときだけクリックテスト
          TEST_MODE: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}

          # テスト対象
          TEST_LOCATION: "府中試験場"
          TEST_DATE: "2026-10-15"

        run: python monitor.py